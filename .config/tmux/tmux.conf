# --- Prefix Key ändern ---
# Wir ändern Strg+b zu Strg+a (leichter zu greifen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Grundlegendes ---
# Maus-Support aktivieren (Wichtig für Anfänger: Klicken, Scrollen, Größe ändern)
set -g mouse on

# Fish als Standard-Shell erzwingen
set-option -g default-shell /usr/bin/fish

# Start-Index auf 1 setzen (0 ist auf der Tastatur zu weit weg)
set -g base-index 1
setw -g pane-base-index 1

# History vergrößern (damit du weit zurückscrollen kannst)
set-option -g history-limit 10000

# Keine Verzögerung bei der Esc-Taste (wichtig für Vim/Neovim Nutzer)
set -s escape-time 0

# --- Optik & Farben ---
# Korrekte Farben für Arch/Fish
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Statusleiste optisch etwas aufhübschen (Standard ist oft grell grün)
set -g status-style bg=default,fg=white
set -g status-position bottom
set -g status-justify left

# --- Bessere Tastenbelegung für Splits ---
# | für vertikalen Split (einfacher zu merken als %)
bind | split-window -h
# - für horizontalen Split (einfacher zu merken als ")
bind - split-window -v
# Die alten Bindings lösen (optional)
unbind '"'
unbind %

# --- Config neu laden mit 'r' ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config neu geladen!"

# --- Vi-Modus für Tmux ---
# Ermöglicht Navigation mit h, j, k, l im Copy-Mode
set-window-option -g mode-keys vi

# Copy-Mode-Steuerung wie in Vim
# 'v' zum Beginnen der Markierung, 'y' zum Kopieren
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# Navigieren zwischen Panes mit hjkl (wie in Vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
