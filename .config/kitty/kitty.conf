# Font — identisch zu Alacritty
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Ligaturen deaktivieren (wie Alacritty)
font_features JetBrainsMonoNerdFont-Regular    -liga -calt
font_features JetBrainsMonoNerdFont-Bold       -liga -calt
font_features JetBrainsMonoNerdFont-Italic     -liga -calt
font_features JetBrainsMonoNerdFont-BoldItalic -liga -calt

# Cursor ohne Blinken (Alacritty-Standard)
cursor_blink_interval 0

# Kein Bestätigungsdialog beim Schließen
confirm_os_window_close 0

# Kein innerer Randabstand
window_padding_width 0

# Farben — Alacritty Standard (Tomorrow Night)
background            #1d1f21
foreground            #c5c8c6
cursor                #c5c8c6
selection_background  #373b41
selection_foreground  #c5c8c6

# Normal (0-7)
color0  #1d1f21
color1  #cc6666
color2  #b5bd68
color3  #f0c674
color4  #81a2be
color5  #b294bb
color6  #8abeb7
color7  #c5c8c6

# Bright (8-15)
color8  #666666
color9  #d54e53
color10 #b9ca4a
color11 #e7c547
color12 #7aa6da
color13 #c397d8
color14 #70c0ba
color15 #eaeaea

# Schriftgrößen-Shortcuts in 0.5pt-Schritten
map ctrl+shift+equal  change_font_size all +0.5
map ctrl+shift+plus   change_font_size all +0.5
map ctrl+shift+minus  change_font_size all -0.5
map ctrl+shift+0      change_font_size all 0

# Keybindings für nvim (Ctrl+Shift+H/J/K/L → CSI-u Sequenzen)
map ctrl+shift+h send_text all \x1b[104;6u
map ctrl+shift+j send_text all \x1b[106;6u
map ctrl+shift+k send_text all \x1b[107;6u
map ctrl+shift+l send_text all \x1b[108;6u
