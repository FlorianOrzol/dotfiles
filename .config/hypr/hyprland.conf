

	# #######################################################################################
	# AUTOGENERATED HYPRLAND CONFIG.
	# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
	# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
	# #######################################################################################


	autogenerated = 0 # remove this line to remove the warning

	# This is an example Hyprland config file.
	# Refer to the wiki for more information.
	# https://wiki.hyprland.org/Configuring/

	# Please note not all available settings / options are set here.
	# For a full list, see the wiki

	# You can split this configuration into multiple files
	# Create your files separately and then link them to this file like this:
	# source = ~/.config/hypr/myColors.conf
	

	################
	### MONITORS ###
	################

	# See https://wiki.hyprland.org/Configuring/Monitors/
	monitor=,preferred,auto,auto
	$monitorMain = DP-1
	$monitorLeft = HDMI-A-1

monitor = DP-1, 3840x1600, 0x1080, 1
monitor = HDMI-A-1, 1920x1080, 0x0, 1
monitor = HDMI-A-2, 1920x1080, 1920x0, 1
#




	###################
	### MY PROGRAMS ###
	###################

	# See https://wiki.hyprland.org/Configuring/Keywords/

	# Set programs that you use
	$terminal = alacritty
	$fileManager = dolphin
	$menu = wofi --show drun


	#################
	### AUTOSTART ###
	#################

	# Autostart necessary processes (like notifications daemons, status bars, etc.)
	# Or execute your favorite apps at launch like this:

	# exec-once = $terminal
	# exec-once = nm-applet &
	# exec-once = waybar & hyprpaper & firefox
	exec-once = /home/florian/.config/hypr/scripts/workspaces.sh init


	#############################
	### ENVIRONMENT VARIABLES ###
	#############################

	# See https://wiki.hyprland.org/Configuring/Environment-variables/

	env = XCURSOR_SIZE,16
	env = HYPRCURSOR_SIZE,16
# env = PATH, $HOME/.local/bin:$PATH


	#####################
	### LOOK AND FEEL ###
	#####################

	# Refer to https://wiki.hyprland.org/Configuring/Variables/

	# https://wiki.hyprland.org/Configuring/Variables/#general
	general {
	    gaps_in = 5
	    gaps_out = 20

	    border_size = 2

	    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
	    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	    col.inactive_border = rgba(595959aa)

	    # Set to true enable resizing windows by clicking and dragging on borders and gaps
	    resize_on_border = false

	    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
	    allow_tearing = false

	    layout = dwindle
	}

	# https://wiki.hyprland.org/Configuring/Variables/#decoration
	decoration {
	    rounding = 10
	    rounding_power = 2

	    # Change transparency of focused and unfocused windows
	    active_opacity = 1.0
	    inactive_opacity = 1.0

	    shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	    }

	    # https://wiki.hyprland.org/Configuring/Variables/#blur
	    blur {
		enabled = true
		size = 3
		passes = 1

		vibrancy = 0.1696
	    }
	}

	# https://wiki.hyprland.org/Configuring/Variables/#animations
	animations {
	    enabled = yes, please :)

	    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

	    bezier = easeOutQuint,0.23,1,0.32,1
	    bezier = easeInOutCubic,0.65,0.05,0.36,1
	    bezier = linear,0,0,1,1
	    bezier = almostLinear,0.5,0.5,0.75,1.0
	    bezier = quick,0.15,0,0.1,1

	    animation = global, 1, 10, default
	    animation = border, 1, 5.39, easeOutQuint
	    animation = windows, 1, 4.79, easeOutQuint
	    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
	    animation = windowsOut, 1, 1.49, linear, popin 87%
	    animation = fadeIn, 1, 1.73, almostLinear
	    animation = fadeOut, 1, 1.46, almostLinear
	    animation = fade, 1, 3.03, quick
	    animation = layers, 1, 3.81, easeOutQuint
	    animation = layersIn, 1, 4, easeOutQuint, fade
	    animation = layersOut, 1, 1.5, linear, fade
	    animation = fadeLayersIn, 1, 1.79, almostLinear
	    animation = fadeLayersOut, 1, 1.39, almostLinear
	    animation = workspaces, 1, 1.94, almostLinear, fade
	    animation = workspacesIn, 1, 1.21, almostLinear, fade
	    animation = workspacesOut, 1, 1.94, almostLinear, fade
	}

	# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
	# "Smart gaps" / "No gaps when only"
	# uncomment all if you wish to use that.
	# workspace = w[tv1], gapsout:0, gapsin:0
	# workspace = f[1], gapsout:0, gapsin:0
	# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
	# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
	# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
	# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

	# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
	dwindle {
	    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
	    preserve_split = true # You probably want this
	}

	# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
	master {
	    new_status = master
	}

	# https://wiki.hyprland.org/Configuring/Variables/#misc
	misc {
	    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
	    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
	}




	#############
	### INPUT ###
	#############

	# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant = 
    kb_model = 
    kb_options = 
	    kb_rules = 

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
#	no_warps = true
	#warp_on_change_workspace = true

}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# --- OPTIK DER TABS ---
group {
    # Titel leiste oben am Fenster (wie Browser Tabs)
    groupbar {
        enabled = true
        font_family = JetBrains Mono
        font_size = 11
        text_color = 0xffffffff
        
        # Farben (Aktiv / Inaktiv)
        col.active = 0xff89b4fa      # Blau
        col.inactive = 0xff313244    # Dunkelgrau
        
        # Höhe der Leiste
        height = 20
        
        # Titel anzeigen?
        render_titles = true
        
        # Farbverläufe aus (Flat Look)
        gradients = false
    }

    # Rand um die Gruppe
    col.border_active = 0xff89b4fa
    col.border_inactive = 0xff313244
}

# --- STEUERUNG (BINDINGS) ---

# 1. Auswahl in Gruppe umwandeln (Tab-Modus an/aus)
bind = $mainMod, G, togglegroup

# 2. Fenster in die Gruppe reinziehen (wenn Gruppe aktiv ist)
# (Standardmäßig schiebt "movewindow" Fenster in eine Gruppe, wenn man draufzieht)

# 3. Zwischen den Tabs wechseln
bind = $mainMod, Tab, changegroupactive, f  # Vorwärts
bind = $mainMod SHIFT, Tab, changegroupactive, b # Rückwärts




# 4. Durch die Tabs wechseln (wie im Browser Strg+Tab)
bind = $mainMod, Tab, cyclenext, bringactivetotop
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, bringactivetotop
bind = $mainMod, F, exec, killall -SIGUSR1 waybar



# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Escape, killactive,
bind = $mainMod, P, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, plus, layoutmsg, togglesplit # dwindle

# Shortcut programs
bind = $mainMod ALT, D, exec, $menu
bind = $mainMod ALT, T, exec, $terminal 
bind = $mainMod ALT, G, exec, google-chrome-stable


# Switch focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch Desktops/Workspaces
bind = $mainMod, space, exec, workspaces --new-desktop
bind = $mainMod SHIFT, space, exec, workspaces --mvx-new-desktop
bind = $mainMod, right, exec, workspaces --next-desktop
bind = $mainMod, left, exec, workspaces --previous-desktop
bind = $mainMod, F1, exec, workspaces --desktop-nr 11
bind = $mainMod, F2, exec, workspaces --desktop-nr 12
bind = $mainMod, F3, exec, workspaces --desktop-nr 13
bind = $mainMod, F4, exec, workspaces --desktop-nr 14
bind = $mainMod, F5, exec, workspaces --desktop-nr 15
bind = $mainMod, F6, exec, workspaces --desktop-nr 16
bind = $mainMod, F7, exec, workspaces --desktop-nr 17
bind = $mainMod, F8, exec, workspaces --desktop-nr 18
bind = $mainMod, F9, exec, workspaces --desktop-nr 19
bind = $mainMod, F10, exec, workspaces --desktop-nr 20
bind = $mainMod, F11, exec, workspaces --desktop-nr 21
bind = $mainMod, F12, exec, workspaces --desktop-nr 22



# Move Window to Desktop/Workspace
bind = $mainMod SHIFT, right, exec, workspaces --mvx-next-desktop
bind = $mainMod SHIFT, left, exec, workspaces --mvx-previous-desktop
bind = $mainMod SHIFT, F1, exec, workspaces --mvx-desktop-nr 11
bind = $mainMod SHIFT, F2, exec, workspaces --mvx-desktop-nr 12
bind = $mainMod SHIFT, F3, exec, workspaces --mvx-desktop-nr 13
bind = $mainMod SHIFT, F4, exec, workspaces --mvx-desktop-nr 14
bind = $mainMod SHIFT, F5, exec, workspaces --mvx-desktop-nr 15
bind = $mainMod SHIFT, F6, exec, workspaces --mvx-desktop-nr 16
bind = $mainMod SHIFT, F7, exec, workspaces --mvx-desktop-nr 17
bind = $mainMod SHIFT, F8, exec, workspaces --mvx-desktop-nr 18
bind = $mainMod SHIFT, F9, exec, workspaces --mvx-desktop-nr 19
bind = $mainMod SHIFT, F10, exec, workspaces --mvx-desktop-nr 20
bind = $mainMod SHIFT, F11, exec, workspaces --mvx-desktop-nr 21
bind = $mainMod SHIFT, F12, exec, workspaces --mvx-desktop-nr 22


# Switch Monitor-Workspace
bind = $mainMod, up, exec, workspaces --next-ws
bind = $mainMod, down, exec, workspaces --previous-ws
bind = $mainMod, 1, exec, workspaces --ws-nr 1
bind = $mainMod, 2, exec, workspaces --ws-nr 2
bind = $mainMod, 3, exec, workspaces --ws-nr 3
bind = $mainMod, 4, exec, workspaces --ws-nr 4

# Move Window to Monitor-Workspace
bind = $mainMod SHIFT, up, exec, workspaces --mvx-next-ws
bind = $mainMod SHIFT, down, exec, workspaces --mvx-previous-ws
bind = $mainMod SHIFT, 1, exec, workspaces --mvx-ws-nr 1
bind = $mainMod SHIFT, 2, exec, workspaces --mvx-ws-nr 2
bind = $mainMod SHIFT, 3, exec, workspaces --mvx-ws-nr 3
bind = $mainMod SHIFT, 4, exec, workspaces --mvx-ws-nr 4

# 

master {
 orientation = right
}
# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, f, fullscreen, 1
bind = $mainMod, M, layoutmsg, cyclenext
bind = $mainMod, T, bringactivetotop

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bind = $mainMod ALT, m, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 
bind = $mainMod ALT, n, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod ALT, u, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod ALT, l, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod ALT, b, exec, brightnessctl s 10%+
bind = $mainMod ALT, v, exec, brightnessctl s 10%-



# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

