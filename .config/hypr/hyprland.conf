#workspace = DP-1, 3

# --- EIGENE FENSTERREGELN ---

# Alacritty immer schwebend starten
windowrule = float true,match:class kitty

# Regeln für das 'scratchpad_terminal' (z.B. Kitty oder Alacritty mit --class scratchpad_terminal)
windowrule = float true,match:class scratchpad_terminal
windowrule = move 0 0,match:class scratchpad_terminal # Position oben links (oder anpassen)
windowrule = size 80% 60%,match:class scratchpad_terminal # Größe anpassen
#windowrule = noborder true,match:class scratchpad_terminal # Kein Rand
windowrule = pin true,match:class scratchpad_terminal # Immer im Vordergrund
windowrule = opaque 0.8,match:class scratchpad_terminal # Transparenz


